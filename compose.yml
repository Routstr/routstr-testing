services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  relay:
    image: scsibug/nostr-rs-relay:latest
    ports:
      - "7777:8080"
    volumes:
      - relay-data:/usr/src/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  mock-openai:
    image: zerob13/mock-openai-api
    ports:
      - "8082:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/v1/models"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Routstr nodes ─────────────────────────────────────────────────────────

  node-a:
    build:
      context: vendor/routstr-core
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/node-a.db
      - NOSTR_RELAY_URL=ws://relay:8080
      - UPSTREAM_BASE_URL=http://mock-openai:3000
      - UPSTREAM_API_KEY=test-key
      - CASHU_MINTS=${CASHU_MINTS:-https://testnut.cashu.space}
      - NAME=NodeA
      - DESCRIPTION=Test node A
      - NPUB=${NODE_A_NPUB:-npub1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqnodeaaa}
      - NSEC=${NODE_A_NSEC:-nsec1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqnodeaaaa}
      - HTTP_URL=http://node-a:8000
      - CORS_ORIGINS=*
      - FIXED_COST_PER_REQUEST=1
      - FIXED_PER_1K_INPUT_TOKENS=10
      - FIXED_PER_1K_OUTPUT_TOKENS=30
      - FIXED_PRICING=false
      - REFUND_PROCESSING_INTERVAL=3600
      - MINIMUM_PAYOUT=1000
      - PAYOUT_INTERVAL=86400
    volumes:
      - node-a-data:/data
    depends_on:
      relay:
        condition: service_healthy
      mock-openai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  node-b:
    build:
      context: vendor/routstr-core
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/node-b.db
      - NOSTR_RELAY_URL=ws://relay:8080
      - UPSTREAM_BASE_URL=http://mock-openai:3000
      - UPSTREAM_API_KEY=test-key
      - CASHU_MINTS=${CASHU_MINTS:-https://testnut.cashu.space}
      - NAME=NodeB
      - DESCRIPTION=Test node B
      - NPUB=${NODE_B_NPUB:-npub1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqnodebbb}
      - NSEC=${NODE_B_NSEC:-nsec1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqnodebbbbb}
      - HTTP_URL=http://node-b:8000
      - CORS_ORIGINS=*
      - FIXED_COST_PER_REQUEST=2
      - FIXED_PER_1K_INPUT_TOKENS=15
      - FIXED_PER_1K_OUTPUT_TOKENS=40
      - FIXED_PRICING=false
      - REFUND_PROCESSING_INTERVAL=3600
      - MINIMUM_PAYOUT=1000
      - PAYOUT_INTERVAL=86400
    volumes:
      - node-b-data:/data
    depends_on:
      relay:
        condition: service_healthy
      mock-openai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ── Routstrd daemon ───────────────────────────────────────────────────────

  routstrd:
    build:
      context: vendor/routstrd
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    environment:
      - RELAY_URL=ws://relay:8080
    command:
      - "sh"
      - "-c"
      - "bun run dist/daemon/index.js --port 8008 --provider http://node-a:8000"
    depends_on:
      relay:
        condition: service_healthy
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8008/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # ── CLI runner (long-lived for docker exec) ───────────────────────────────

  cli-runner:
    build:
      context: vendor/routstr-cli
      dockerfile: ../../vendor-dockerfiles/routstr-cli.Dockerfile
    environment:
      - ROUTSTRD_URL=http://routstrd:8008
      - E2E_CASHU_TOKEN=${E2E_CASHU_TOKEN:-}
    depends_on:
      routstrd:
        condition: service_healthy
    volumes:
      - ./tests:/tests
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

volumes:
  relay-data:
  node-a-data:
  node-b-data:
