[project]
name = "routstr-testing"
version = "0.1.0"
description = "End-to-end test harness for the Routstr stack."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "sqlmodel>=0.0.24",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[tool.setuptools]
packages = ["runner", "server"]

[tool.pytest.ini_options]
markers = [
    "requires_funded_daemon: test depends on a topped-up routstrd",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
