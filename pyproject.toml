[project]
name = "routstr-testing"
version = "0.1.0"
description = "End-to-end test harness for the Routstr stack."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "sqlmodel>=0.0.24",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[dependency-groups]
# Tooling the no-docker `pr` CI lane runs (ruff + mypy). Pinned and declared
# here so CI is hermetic (`uv sync --group dev`) instead of leaking whatever
# ruff/mypy happen to be on a contributor's PATH. types-PyYAML supplies the
# stubs mypy needs for runner/{providers,scenario}.py.
dev = [
    "ruff==0.1.7",
    "mypy==1.9.0",
    "types-PyYAML>=6.0",
]

[tool.setuptools]
packages = ["runner", "server", "tests"]

[tool.mypy]
# The no-docker CI lane type-checks the money-path orchestrator package
# (runner/) only. server/ uses idiomatic SQLModel query expressions that
# trip SQLAlchemy's typing overloads — out of scope for this lane.
python_version = "3.11"
files = ["runner"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
markers = [
    "requires_funded_daemon: test depends on a topped-up routstrd",
    "safe_for_remote: read-only / non-mutating against a routstr node; safe to point at someone else's deployment",
    "destructive: mutates routstr node state (refund, topup, child-key creation, payouts); only runs against TARGET_PROFILE=local",
    "admin_required: needs a valid admin token; auto-skipped under TARGET_PROFILE=remote when REMOTE_NODE_ADMIN_TOKEN_<i> is not provided",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
